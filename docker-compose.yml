services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - 1433:1433
    volumes:
      - mssql:/var/opt/mssql
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD:?}"

  back-office:
    build:
      context: Back-office
    ports:
      - 8000:5000
    environment:
      - RUNNING_IN_DOCKER=true
    env_file:
      - .env
    volumes:
      - backofficekeys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - mssql

  webapp:
    build:
      context: Webapp
    ports:
      - 8001:5000
    environment:
      - RUNNING_IN_DOCKER=true
    env_file:
      - .env
    volumes:
      - webappkeys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - mssql

  databaseapi:
    build:
      context: DatabaseApi
    ports:
      - 8002:5000
    environment:
      - RUNNING_IN_DOCKER=true
    env_file:
      - .env
    volumes:
      - databaseapikeys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - mssql

volumes:
  mssql:
  backofficekeys:
  webappkeys:
  databaseapikeys:
