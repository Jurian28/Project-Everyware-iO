services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports:
      - 1433:1433
    volumes:
      - mssql:/var/opt/mssql
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD:?}"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  back-office:
    build:
      context: .
      dockerfile: Back-office/dockerfile
    ports:
      - "${BACK_OFFICE_PORT:?}:5000"
    environment:
      - RUNNING_IN_DOCKER=true
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    env_file:
      - .env
    volumes:
      - ./Back-office:/app/Back-office
      - backofficekeys:/root/.aspnet/DataProtection-Keys
    develop:
      watch:
        - action: sync
          path: ./Back-office
          target: /app/Back-office
          ignore:
            - bin/
            - obj/
        - action: sync
          path: ./SharedClassLibrary
          target: /app/SharedClassLibrary
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./Back-office/Back-office.csproj
    depends_on:
      - mssql
      - databaseapi

  webapp:
    build:
      context: .
      dockerfile: WebApp/dockerfile
    ports:
      - "${WEB_APP_PORT:?}:5000"
    environment:
      - RUNNING_IN_DOCKER=true
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    env_file:
      - .env
    volumes:
      - webappkeys:/root/.aspnet/DataProtection-Keys
    develop:
      watch:
        - action: sync
          path: ./WebApp
          target: /app/WebApp
          ignore:
            - bin/
            - obj/
        - action: sync
          path: ./SharedClassLibrary
          target: /app/SharedClassLibrary
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./WebApp/WebApp.csproj
    depends_on:
      - mssql
      - databaseapi

  databaseapi:
    build:
      context: .
      dockerfile: DatabaseApi/dockerfile
    ports:
      - "${DATABASE_API_PORT:?}:5000"
    environment:
      - RUNNING_IN_DOCKER=true
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    env_file:
      - .env
    volumes:
      - databaseapikeys:/root/.aspnet/DataProtection-Keys
      - uploads:/app/DatabaseApi/uploads
    develop:
      watch:
        - action: sync
          path: ./DatabaseApi
          target: /app/DatabaseApi
          ignore:
            - bin/
            - obj/
            - wwwroot/
        - action: sync
          path: ./SharedClassLibrary
          target: /app/SharedClassLibrary
          ignore:
            - bin/
            - obj/
        - action: rebuild
          path: ./DatabaseApi/DatabaseApi.csproj
    depends_on:
      mssql:
        condition: service_healthy

volumes:
  mssql:
  backofficekeys:
  webappkeys:
  databaseapikeys:
  uploads:
