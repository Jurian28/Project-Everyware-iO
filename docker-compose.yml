services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    ports: 
      - 1433:1433
    volumes:
      - mssql:/var/opt/mssql
    environment:
      ACCEPT_EULA: "Y"

  back-office:
    build:
      context: Back-office
    ports:
      - 5003:5000

  webapp:
    build:
      context: Webapp
    ports:
      - 5001:5000

  databaseapi:
    build:
      context: DatabaseApi
    ports:
      - 5002:5000


volumes:
  mssql:
